<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="The good old mathematical incremental game by Timeforrefs (heavily inspired by Algebraic Progression)" />
        <title>Mathematical Incremental v0.0.1</title>
        <link rel="icon" type="image/png" href="mathinc.png">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="main-container">
            <p id="points">Total = 0.00</p>
            <p id="pointsproduced">You are producing 0.00 point(s) per second</p>
            <button id="clicker">+1 Point</button>
        </div>
        <div class="addition-container" id="add-cont">
            <p class="main-add">Addition (+)</p>
            <hr class="add-break">
            <div class="summations">
                <p id="sum">You have 0 Summations producing 0 point(s) per second</p>
                <button id="sum-btn">Buy Summation (Cost: 10 points)</button>
            </div>
            <div class="evaluations">
                <p id="eval">You have 0 Evaluations producing 0 points per second</p>
                <button id="eval-btn">Buy Evaluation (Cost: 100 points)</button>
            </div>
            <div class="tallies">
                <p id="tally">You have 0 Tallies producing 0 points per second</p>
                <button id="tally-btn">Buy Tally (Cost: 500 points)</button>
            </div>
        </div>
        <script src="game.js"></script>
    </body>
</html>
